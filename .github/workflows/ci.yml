name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install (root)
        run: npm ci --no-audit --no-fund
      - name: Install (mcp)
        run: npm --prefix mcp ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Type-check the core without DOM types
        run: npm run typecheck:core
      - name: Type-check all of src (adapters, cli) with ES2022 and Node types, no DOM
        run: npm run typecheck:all
      - name: Rebuild every committed artifact
        run: npm run build:all
      - name: Test
        run: npm test
      - name: Committed artifacts match the sources
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)" || { git status --porcelain; exit 1; }
